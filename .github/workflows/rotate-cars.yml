# Daily inventory-growth agent — see scripts/rotate-car-inventory.ts.
#
# Calls Claude to generate a batch of listings not already in the dataset,
# fetches a matching photo for each, and appends them to
# app/_lib/carData.ts — existing cars are never modified or removed, the
# list only grows. Pushes straight to main if anything changed, which
# triggers the existing `deploy` workflow, so the live site picks up the
# new inventory automatically.
#
# Requires one repo secret: ANTHROPIC_API_KEY.
name: rotate-cars
on:
  schedule:
    - cron: '0 13 * * *' # ~6am Pacific daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npx tsx scripts/rotate-car-inventory.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit and push if the inventory changed
        run: |
          git config user.name "carpilot-bot"
          git config user.email "actions@github.com"
          git add app/_lib/carData.ts public/cars
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Daily inventory growth: $(date -u +%Y-%m-%d)"
          git push
