# Daily inventory-refresh agent — see scripts/rotate-car-inventory.ts.
#
# Calls Claude to generate a fresh batch of listings, fetches a matching
# photo for each, rewrites app/_lib/carData.ts, and pushes straight to
# main if anything changed. That push triggers the existing `deploy`
# workflow, so the live site picks up the new inventory automatically.
#
# Requires one repo secret: ANTHROPIC_API_KEY.
name: rotate-cars
on:
  schedule:
    - cron: '0 13 * * *' # ~6am Pacific daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npx tsx scripts/rotate-car-inventory.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit and push if the inventory changed
        run: |
          git config user.name "carpilot-bot"
          git config user.email "actions@github.com"
          git add app/_lib/carData.ts public/cars
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Daily inventory refresh: $(date -u +%Y-%m-%d)"
          git push
