# Daily inventory-growth agent — see scripts/rotate-car-inventory.ts.
#
# Calls Claude to generate a batch of listings not already in the dataset,
# fetches a matching photo for each, and appends them to
# app/_lib/carData.ts — existing cars are never modified or removed, the
# list only grows. Opens a PR with the change (main is protected and
# requires a reviewed PR, so this can't push directly) — someone still
# needs to approve + merge it for the new inventory to go live. Merging
# triggers the existing `deploy` workflow automatically.
#
# Requires one repo secret: ANTHROPIC_API_KEY.
name: rotate-cars
on:
  schedule:
    - cron: '0 13 * * *' # ~6am Pacific daily
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npx tsx scripts/rotate-car-inventory.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Open a PR if the inventory changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "carpilot-bot"
          git config user.email "actions@github.com"
          git add app/_lib/carData.ts public/cars
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          BRANCH="daily-cars/$(date -u +%Y-%m-%d)-${{ github.run_number }}"
          git checkout -b "$BRANCH"
          git commit -m "Daily inventory growth: $(date -u +%Y-%m-%d)"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Daily inventory growth: $(date -u +%Y-%m-%d)" \
            --body "Automated — adds today's batch of new car listings. Generated by scripts/rotate-car-inventory.ts, see .github/workflows/rotate-cars.yml."
